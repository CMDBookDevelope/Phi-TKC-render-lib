              type="range"
              min="0"
              max="60"
              step="0.05"
              :value="S.time"
              @input="onTimeInput"
            />
          </label>
          <div class="np-row">
            <button class="np-btn np-btn-full" @click="togglePlay">

              type="range"
              min="1"
              max="32"
              step="1"

              max="4"
              step="0.05"
              :value="S.noiseStrength"
              @input="onNoiseInput"
            />
          </label>

              class="np-range"
              type="range"
              :min="s[1]"
              :max="s[2]"
              :step="s[3]"
              :value="S.params[s[0]]"
              @input="onParamInput(s[0], $event)"
            />
          </label>

          <div class="np-head">内部</div>
          <label v-for="s in INNER_SLIDERS" :key="s[0]" class="np-rng">
            <span class="np-rng-head"><span>{{ s[4] }}</span><output>{{ Number(S.params[s[0]]).toFixed(3) }}</output></span>
            <input
              class="np-range"
              type="range"
              :min="s[1]"
              :max="s[2]"
              :step="s[3]"
              :value="S.params[s[0]]"
              @input="onParamInput(s[0], $event)"
            />
          </label>

        class="np-stage"
        :class="{ dragover: dragging }"
        ref="stageRef"
        @dragover.prevent="dragging = true"
        @dragleave="dragging = false"
        @drop.prevent="onDrop"

          class="np-frame"
          ref="frameRef"
          :style="{ cursor: S.tool === 'move' ? 'move' : 'crosshair' }"
          v-show="!!S.imgW"
        >
          <canvas class="np-view" ref="viewRef"></canvas>
          <canvas class="np-overlay" ref="overlayRef"></canvas>
        </div>
      </div>

    <div class="np-err" v-if="errMsg">{{ errMsg }}</div>
  </div>

   - 遮罩在官方规定的 1/8 分辨率网格上按像素中心光栅化（除数可调）；
   - 用 BlockNoise1.png 做 ±45° 双向噪声置换（复刻 mediump 舍入）；
   - 2 倍最近邻上采样成 uMasks（RGBA = 合成, Edge, Glow, 禁用合成）；
   - Edge / Glow 用官方九宫格膨胀 + 环带提取（bit row dilation）；
   - 片元着色器为官方导出 GLSL 原样使用（仅特化掉悬浮 SDF 分支）。
   逻辑与 E:\PRT\extra\blockEffect 单文件版一致，界面改为本站风格。
   ===================================================================== */

/* 通用工具                                                            */
/* ------------------------------------------------------------------ */
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v))
const _f32 = new Float32Array(1), _u32 = new Uint32Array(_f32.buffer)
/* 复刻 GLSL mediump(f16)：十位尾数、就近取偶 */
function medium(v) { _f32[0] = v; let b = _u32[0]; b = ((b + 0xfff + ((b >>> 13) & 1)) & ~0x1fff) >>> 0; _u32[0] = b; return _f32[0] }
/* 与 Rust noise_index 相同：镜像（mirror）寻址 */
function noiseIndex(v, size) { v = v % 2; if (v < 0) v += 2; if (v > 1) v = 2 - v; const i = Math.floor(v * size); return i < 0 ? 0 : (i > size - 1 ? size - 1 : i) }

const CENTERED = (() => { const t = new Float32Array(256); for (let i = 0; i < 256; i++) t[i] = medium(medium(i / 255) - 0.5); return t })()
const GLOW_W = (() => {
  let s = 0; for (let k = 1; k <= 6; k++) s += Math.pow(k, 2.65)
  return Array.from({ length: 6 }, (_, p) => Math.pow(6 - p, 2.65) / s)
})()

let rafId = 0, disposed = false, errTimer = 0

function showErr(msg) {
  errMsg.value = String(msg && msg.stack ? msg.stack : msg)
  clearTimeout(errTimer)
  errTimer = setTimeout(() => { errMsg.value = '' }, 12000)
}

/* ------------------------------------------------------------------ */
/* GL                                                                  */
/* ------------------------------------------------------------------ */
function createGL(canvas) {
  const opts = {
    alpha: false, antialias: false, depth: false, stencil: false,
    preserveDrawingBuffer: true, premultipliedAlpha: false, powerPreference: 'high-performance'
  }
  let g = canvas.getContext('webgl2', opts)
  if (!g) g = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts)
  return g
}
function compile(g, type, src) {
  const s = g.createShader(type); g.shaderSource(s, src); g.compileShader(s)
  if (!g.getShaderParameter(s, g.COMPILE_STATUS)) {
    throw new Error('着色器编译失败:\n' + g.getShaderInfoLog(s))
  }
  return s
}
function link(g, vs, fs) {
  const p = g.createProgram(); g.attachShader(p, vs); g.attachShader(p, fs)
  g.bindAttribLocation(p, 0, 'aPos'); g.linkProgram(p)
  if (!g.getProgramParameter(p, g.LINK_STATUS)) throw new Error('着色器链接失败:\n' + g.getProgramInfoLog(p))
  return p
}
function texFromImage(g, img, wrap, filter) {
  const t = g.createTexture()
  g.bindTexture(g.TEXTURE_2D, t)
  g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL, false)
  g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, g.RGBA, g.UNSIGNED_BYTE, img)
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, wrap)
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, wrap)
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, filter)
  g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, filter)
  return t
}
function makeSolid(r, g_, b, a) {
  const t = gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D, t)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([r, g_, b, a]))
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
  return t
}
function initGL() {
  gl = createGL(glCanvas)
  if (!gl) throw new Error('无法创建 WebGL 上下文，请使用较新的 Chrome / Edge / Firefox。')

  progBlit = link(gl, compile(gl, gl.VERTEX_SHADER, VERT_BLIT), compile(gl, gl.FRAGMENT_SHADER, FRAG_BLIT))
  progBlock = link(gl, compile(gl, gl.VERTEX_SHADER, VERT_BLOCK), compile(gl, gl.FRAGMENT_SHADER, FRAG_SRC))

  const vbo = gl.createBuffer()
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo)
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0)
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)

  texDisplace = texFromImage(gl, imgDisplace, gl.MIRRORED_REPEAT, gl.NEAREST) /* 官方 Mirror + Nearest */
  texSpark = texFromImage(gl, imgSpark, gl.REPEAT, gl.NEAREST)                /* 官方 Repeat + Nearest */
  texNoise = texFromImage(gl, imgNoise, gl.MIRRORED_REPEAT, gl.NEAREST)       /* 官方 Mirror + Nearest */

  texAux = makeSolid(0, 0, 0, 0)
  texMask = makeSolid(0, 0, 0, 0)
}
function uB(name) { if (!(name in cacheBlock)) cacheBlock[name] = gl.getUniformLocation(progBlock, name); return cacheBlock[name] }
function uBlit(name) { if (!(name in cacheBlit)) cacheBlit[name] = gl.getUniformLocation(progBlit, name); return cacheBlit[name] }

/* ------------------------------------------------------------------ */
/* 遮罩计算（官方 CPU 等价实现）                                        */
/* ------------------------------------------------------------------ */
/* 单元格是 2 位图层：bit0 = 普通通道，bit1 = 反相通道。
   两个通道各自独立（和官方一样：反相块画在普通块「上面」，不会把普通块抹掉），
   所以 3 = 两个通道都有 —— 这正是「在实心区块里挖洞」所需要的。 */
const CELL_BIT = { 0: 0, 1: 1, 2: 2 }
function cellMatches(v, value) { const b = CELL_BIT[value]; return b === 0 ? v === 0 : (v & b) !== 0 }
function paintCell(i, value) {
  const cur = S.cells[i]
  S.cells[i] = value === 0 ? 0 : (value === 2 ? (cur | 2) : (cur & ~2) | 1)
}

function buildZones() {
  const out = []
  const { gw, gh, cell, cells, imgW, imgH } = S
  if (cells && gw && gh) {
    /* 两个通道各扫一遍：bit0 → 普通区块，bit1 → 反相区块 */
    for (const bit of [1, 2]) {
      for (let y = 0; y < gh; y++) {
        let x = 0
        while (x < gw) {
          if (!(cells[y * gw + x] & bit)) { x++; continue }
          let x2 = x + 1; while (x2 < gw && (cells[y * gw + x2] & bit)) x2++
          const px = x * cell, py = y * cell
          const pw = Math.min(x2 * cell, imgW) - px, ph = Math.min((y + 1) * cell, imgH) - py
          if (pw > 0 && ph > 0) out.push({ x: px, y: py, w: pw, h: ph, subtract: (bit === 2) })
          x = x2
        }
      }
    }
  }
  for (const r of S.rects) out.push({ x: r.x, y: r.y, w: r.w, h: r.h, subtract: !!r.subtract })
  return out
}

function dilate32(src, dst, width, height) {
  const stride = (width + 31) >> 5
  const lastMask = (0xFFFFFFFF >>> ((32 - (width % 32)) % 32)) >>> 0
  for (let y = 0; y < height; y++) {
    const y0 = y > 0 ? y - 1 : 0, y1 = y < height - 1 ? y + 1 : height - 1
    for (let w = 0; w < stride; w++) {
      let v = 0
      for (let row = y0; row <= y1; row++) {
        const idx = row * stride + w
        const mid = src[idx]
        const left = w > 0 ? (src[idx - 1] >>> 31) : 0
        const right = w + 1 < stride ? (src[idx + 1] << 31) : 0
        v |= mid | (mid << 1) | left | (mid >>> 1) | right
      }
      dst[y * stride + w] = (w + 1 === stride) ? ((v & lastMask) >>> 0) : (v >>> 0)
    }
  }
}

function computeMasks(W, H, zones, time, edgePasses, noiseStrength, blockPx) {
  /* 一格 = blockPx 个原图像素（官方写死 8）；blockPx 最小 1，格数受 BW_MAX 封顶 */
  const bp = Math.max(1, Math.min(64, Math.round(blockPx) || 4))
  const bw = Math.max(1, Math.min(Math.floor(W / bp), BW_MAX))
  const bh = Math.max(1, Math.min(Math.floor(H / bp), BW_MAX))
  const ew = bw * 2, eh = bh * 2, n = bw * bh
  /* 边缘环带占前几格：1 格 ≈ 4 个原图像素，官方默认 = 1 格（系数越大环带越细） */
  const ep = Math.max(1, Math.min(6, edgePasses || 1))
  const norm = new Float32Array(n), sub = new Float32Array(n)
  const sx = bw / W, sy = bh / H

  /* 逐区块「覆盖」：普通 = 满值，反相 = 0.1（官方 SubtractBlockBlender 的阈值窗口 [0.09,0.12)）。
     这里是覆盖而不是累加：官方的累加是「一个 blockArea 画一次」，
     而我们的画笔笔迹会被 buildZones 拆成几百条 1 像素高的扫描线矩形。 */
  let zcount = 0
  for (const z of zones) {
    if (z.w <= 0 || z.h <= 0) continue
    let x0 = Math.ceil(z.x * sx - 0.5), x1 = Math.floor((z.x + z.w) * sx - 0.5) + 1
    let y0 = Math.ceil(z.y * sy - 0.5), y1 = Math.floor((z.y + z.h) * sy - 0.5) + 1
    /* 比一个遮罩格还窄的矩形，整个落在两格中心之间 → 一条都覆盖不到，会静默消失。
       画笔栅格细化到 1px 后这几乎是必然发生，按「矩形中心落在哪一格」兜底。 */
    if (x1 <= x0) { x0 = Math.floor((z.x + z.w * 0.5) * sx); x1 = x0 + 1 }
    if (y1 <= y0) { y0 = Math.floor((z.y + z.h * 0.5) * sy); y1 = y0 + 1 }
    if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0
    if (x1 > bw) x1 = bw; if (y1 > bh) y1 = bh
    const v = z.subtract ? 26 : 255          /* 26/255 ≈ 0.102，落在官方窗口正中 */
    const dst = z.subtract ? sub : norm
    for (let y = y0; y < y1; y++) {
      const row = y * bw
      for (let x = x0; x < x1; x++) dst[row + x] = v
    }
    zcount++
  }
  /* 反相层：官方 SubtractBlockBlender 的阈值窗口 [0.09,0.12) */
  const compose = new Uint8Array(n)
  for (let i = 0; i < n; i++) {
    const r = sub[i] / 255
    compose[i] = Math.abs(norm[i] - ((r >= 0.09 && r < 0.12) ? 255 : 0))
  }
  /* 双向噪声置换（BlockCompose pass 0）。官方振幅系数固定 0.1；
     「外圈噪声强度」放大它 → 每个区块独立地按远处噪声决定归属，
     外轮廓就从一条锯齿线碎成一颗颗小像素块。0 = 完全不抖（干净方块）。 */
  const nstr = Math.max(0, noiseStrength === undefined ? 1 : noiseStrength)
  const amp = 0.1 * nstr
  const d = 0.70703125, dt = d * (time / 20 * 2.59)
  const wxA = new Int32Array(bw), wxB = new Int32Array(bw)
  for (let x = 0; x < bw; x++) {
    const u = (x + 0.5) / bw
    wxA[x] = noiseIndex(dt + u * 2.13, NOISE_W)
    wxB[x] = noiseIndex(-dt + u * 2.13, NOISE_W)
  }
  const wyRow = new Int32Array(bh)
  for (let y = 0; y < bh; y++) wyRow[y] = noiseIndex(dt + ((y + 0.5) / bh) * 1.02, NOISE_H) * NOISE_W

  const fm = new Uint8Array(n)
  for (let y = 0; y < bh; y++) {
    const row = wyRow[y]
    for (let x = 0; x < bw; x++) {
      const a = CENTERED[noiseR[row + wxA[x]]]
      const b = CENTERED[noiseR[row + wxB[x]]]
      const u = (d * a + b * -d) * amp + (x + 0.5) / bw
      const v = (d * a + b * d) * amp + (y + 0.5) / bh
      let sxi = Math.floor(u * bw); if (sxi < 0) sxi = 0; else if (sxi > bw - 1) sxi = bw - 1
      let syi = Math.floor(v * bh); if (syi < 0) syi = 0; else if (syi > bh - 1) syi = bh - 1
      fm[y * bw + x] = compose[syi * bw + sxi]
    }
  }
  /* 2 倍最近邻上采样 → uMasks RGBA = (合成, Edge, Glow, 禁用合成=0) */
  const rgba = new Uint8Array(ew * eh * 4)
  const stride = (ew + 31) >> 5
  const active = new Uint32Array(stride * eh)
  for (let y = 0; y < bh; y++) {
    for (let x = 0; x < bw; x++) {
      const m = fm[y * bw + x]
      if (!m) continue
      const px = x * 2, py = y * 2, o = (py * ew + px) * 4, o2 = o + ew * 4
      rgba[o] = m; rgba[o + 4] = m; rgba[o2] = m; rgba[o2 + 4] = m
      const wi = px >> 5, sh = px & 31, bits = (3 << sh) >>> 0
      active[py * stride + wi] = (active[py * stride + wi] | bits) >>> 0
      active[(py + 1) * stride + wi] = (active[(py + 1) * stride + wi] | bits) >>> 0
    }
  }
  /* Edge / Glow：九宫格膨胀 + 环带提取 */
  let ping = active, pong = new Uint32Array(active.length)
  for (let pass = 0; pass < 6; pass++) {
    const w = GLOW_W[pass]; if (w < 0.01) break
    dilate32(ping, pong, ew, eh)
    for (let y = 0; y < eh; y++) {
      const base = y * stride
      for (let wi = 0; wi < stride; wi++) {
        let ring = ((pong[base + wi] & ~ping[base + wi]) >>> 0)
        while (ring !== 0) {
          const low = (ring & -ring) >>> 0
          const bit = 31 - Math.clz32(low)
          const x = wi * 32 + bit
          if (x < ew) {
            const dst = (y * ew + x) * 4
            if (pass < ep) rgba[dst + 1] = 255
            rgba[dst + 2] = Math.round(w * 255)
          }
          ring = ((ring & (ring - 1)) >>> 0)
        }
      }
    }
    const t = ping; ping = pong; pong = t
  }
  return { rgba: rgba, ew: ew, eh: eh, count: zcount }
}

function uploadMask(m) {
  maskEw = m.ew; maskEh = m.eh
  gl.bindTexture(gl.TEXTURE_2D, texMask)
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, m.ew, m.eh, 0, gl.RGBA, gl.UNSIGNED_BYTE, m.rgba)
}

/* ------------------------------------------------------------------ */
/* 渲染                                                                */
/* ------------------------------------------------------------------ */
function previewDims() {
  const W = S.imgW, H = S.imgH
  const maxDim = 1920, maxArea = 1920 * 1080
  const s = Math.min(1, maxDim / Math.max(W, H), Math.sqrt(maxArea / (W * H)))
  return [Math.max(8, Math.round(W * s)), Math.max(8, Math.round(H * s))]
}
/* 遮罩网格固定绑定到「原图分辨率」，与预览/导出的渲染分辨率无关，
   这样预览与导出得到完全相同的区块粒度（官方是「屏幕 / 8」，这里以原图为准）。
   一格 = 最小像素点大小，由 S.blockPx 控制（默认 4，官方 8）。 */
const MASK_MAX = 4096
/* 遮罩网格上限：一格最小 1px 时，4096 宽的图会算出 4096×2304 的格 → 纹理 8192×4608，
   内存与每帧开销都不可接受，所以把每边的格数截到 BW_MAX（纹理边长 2×BW_MAX）。 */
const BW_MAX = 1024
function maskDims() {
  return [Math.max(16, Math.min(S.imgW, MASK_MAX)), Math.max(16, Math.min(S.imgH, MASK_MAX))]
}
function blockDiv() { return Math.max(1, Math.min(64, Math.round(S.blockPx) || 4)) }
/* 真实生效的格数与一格多少原图像素（被 MASK_MAX / BW_MAX 截断时会和滑块值不同，如实显示） */
function maskGrid() {
  const W = maskDims()[0], H = maskDims()[1], bp = blockDiv()
  const bw = Math.max(1, Math.min(Math.floor(W / bp), BW_MAX))
  const bh = Math.max(1, Math.min(Math.floor(H / bp), BW_MAX))
  return { W: W, H: H, bw: bw, bh: bh }
}
function maskBlockPx() { const g = maskGrid(); return g.W / g.bw }
/* 边缘像素强度 1..6（越大越细）：反向映射成「环带占几格」 */
function edgePassesOf() { return 7 - clamp(Math.round(S.edgeStrength) || 6, 1, 6) }
/* 边缘环带是按 2× 过采样的遮罩纹理算的，所以 1 格环带 = 半格像素 */
function edgeTexelPx() { return maskBlockPx() / 2 }
function fmtPx(px) { return Math.abs(px - Math.round(px)) < 0.05 ? String(Math.round(px)) : px.toFixed(1) }
/* 只显示实际换算出的像素大小 */
function blockInfo() { return fmtPx(maskBlockPx()) + ' px' }
function edgeInfo() {
  const ep = edgePassesOf(), px = ep * edgeTexelPx()
  return S.edgeStrength + ' · ' + fmtPx(px) + ' px'
}
/* 始终显示换算出的像素大小：还没导入图片时按最小网格兜底，滑动时能实时看到读数 */
const blockInfoText = computed(() => blockInfo())
const edgeInfoText = computed(() => edgeInfo())

function bind(unit, tex, name) {
  gl.activeTexture(gl.TEXTURE0 + unit)
  gl.bindTexture(gl.TEXTURE_2D, tex)
  gl.uniform1i(uB(name), unit)
}

function renderInto(W, H) {
  const zones = buildZones()
  const md = maskDims()
  const key = md[0] + 'x' + md[1] + '|' + S.time.toFixed(4) + '|' + S.rev + '|' + S.edgeStrength + '|' + S.noiseStrength + '|' + S.blockPx
  let zoneCount = zones.length
  if (key !== maskKey) {
    const tm = performance.now()
    const m = computeMasks(md[0], md[1], zones, S.time, edgePassesOf(), S.noiseStrength, blockDiv())
    uploadMask(m)
    maskMs = performance.now() - tm
    maskKey = key; zoneCount = m.count
  }
  S.zoneCount = zoneCount

  gl.viewport(0, 0, W, H)
  gl.disable(gl.BLEND)
  gl.clearColor(0, 0, 0, 1)
  gl.clear(gl.COLOR_BUFFER_BIT)

  /* 场景底图 */
  gl.useProgram(progBlit)
  gl.activeTexture(gl.TEXTURE0)
  gl.bindTexture(gl.TEXTURE_2D, texImage)
  gl.uniform1i(uBlit('uTex'), 0)
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)

  /* 效果层：One / OneMinusSrcAlpha（官方激活层混合） */
  gl.useProgram(progBlock)
  gl.enable(gl.BLEND)
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA)

  for (const [k, v] of Object.entries(S.params)) gl.uniform1f(uB(k), v)
  for (const [k, v] of Object.entries(BASE_COLORS)) gl.uniform4f(uB(k), v[0], v[1], v[2], v[3])
  gl.uniform3f(uB('_SparkTint'), SPARK_TINT[0], SPARK_TINT[1], SPARK_TINT[2])
  gl.uniform3f(uB('uDisabledSparkTint'), 0.31132078, 0.077830195, 0.077830195)
  gl.uniform4f(uB('uUnityTime'), S.time / 20, S.time, S.time * 2, S.time * 3)
  gl.uniform4f(uB('_ScreenParams'), W, H, 1 + 1 / W, 1 + 1 / H)
  gl.uniform4f(uB('_EffectRT_TexelSize'), 1 / maskEw, 1 / maskEh, maskEw, maskEh)
  gl.uniform1i(uB('_TouchPosCount'), 0)
  gl.uniform1i(uB('uLayer'), 3)
  gl.uniform1f(uB('uClipHalfWidth'), 1.0)   /* 关闭官方 Ready 用的左右裁切 */

  bind(0, texDisplace, 'uDisplaceTex')
  bind(1, texSpark, 'uSparkTex')
  bind(2, texMask, 'uMasks')
  bind(3, texImage, 'uScene')
  bind(4, texAux, 'uAuxMasks')
  bind(5, texNoise, 'uNoiseTex')
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
  gl.disable(gl.BLEND)
}

let _renderT0 = 0
function renderNow() {
  if (!S.img || !gl) return
  _renderT0 = performance.now()
  const dim = previewDims()
  if (glCanvas.width !== dim[0] || glCanvas.height !== dim[1]) {
    glCanvas.width = dim[0]; glCanvas.height = dim[1]
  }
  renderInto(dim[0], dim[1])
  frameMs = performance.now() - _renderT0
  S.perf = (frameMs || 0).toFixed(1) + ' ms  ·  遮罩 ' + (maskMs || 0).toFixed(1) + ' ms'
}

function requestRender() { dirty = true }

/* ------------------------------------------------------------------ */
/* 覆盖层（拖拽预览 / 光标）                                             */
/* ------------------------------------------------------------------ */
function normRect(a, b) { return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) } }

function drawOverlay() {
  if (!octx) return
  const W = overlay.width, H = overlay.height
  octx.clearRect(0, 0, W, H)
  if (!S.img) return
  const sx = W / S.imgW, sy = H / S.imgH
  const d = S.drag
  if (d && d.type === 'rect') {
    const r = normRect(d.a, d.b)
    octx.setLineDash([5, 4]); octx.lineWidth = 1.5; octx.strokeStyle = '#fff'
    octx.strokeRect(r.x * sx, r.y * sy, r.w * sx, r.h * sy); octx.setLineDash([])
  }
  if (d && d.type === 'line') {
    const r = Math.max(S.brush / 2, S.cell * 0.5)
    octx.save()
    octx.globalAlpha = .55
    octx.lineCap = 'round'; octx.lineWidth = Math.max(1, r * 2 * sx)
    octx.strokeStyle = d.value === 2 ? '#ffb454' : '#ff5a5f'
    octx.beginPath(); octx.moveTo(d.a.x * sx, d.a.y * sy); octx.lineTo(d.b.x * sx, d.b.y * sy); octx.stroke()
    octx.globalAlpha = 1; octx.lineWidth = 1.5; octx.setLineDash([5, 4]); octx.strokeStyle = '#fff'
    octx.beginPath(); octx.moveTo(d.a.x * sx, d.a.y * sy); octx.lineTo(d.b.x * sx, d.b.y * sy); octx.stroke()
    octx.setLineDash([])
    octx.restore()
  }
  const hv = S.hover
  const wantTip = S.tool === 'brush' || S.tool === 'eraser' || S.tool === 'line'
  if (hv && wantTip && !(d && d.type === 'move') && !(d && d.type === 'line')) {
    const r = Math.max(2, (S.brush / 2) * sx)
    octx.lineWidth = 1.5
    octx.strokeStyle = S.tool === 'eraser' ? '#41d18a' : (S.subtract ? '#ffb454' : '#ff5a5f')
    octx.beginPath()
    if (S.square) octx.rect(hv.x * sx - r, hv.y * sy - r, r * 2, r * 2)
    else octx.arc(hv.x * sx, hv.y * sy, r, 0, Math.PI * 2)
    octx.stroke()
  }
  if (hv && S.tool === 'fill' && !d) {
    octx.lineWidth = 1.5; octx.strokeStyle = S.subtract ? '#ffb454' : '#ff5a5f'
    octx.beginPath()
    octx.moveTo(hv.x * sx - 7, hv.y * sy); octx.lineTo(hv.x * sx + 7, hv.y * sy)

  }
}

/* ------------------------------------------------------------------ */
/* 编辑                                                                */
/* ------------------------------------------------------------------ */
function snapshot() { return { cells: S.cells.slice(), rects: S.rects.map(r => ({ x: r.x, y: r.y, w: r.w, h: r.h, subtract: r.subtract })) } }
function pushUndo() { S.history.push(snapshot()); if (S.history.length > 80) S.history.shift(); S.future.length = 0 }
function restore(s) { S.cells = s.cells.slice(); S.rects = s.rects.map(r => markRaw({ ...r })); S.sel = null; S.rev++; maskKey = '' }
function undo() { if (!S.history.length) return; S.future.push(snapshot()); restore(S.history.pop()); requestRender(); drawOverlay() }
function redo() { if (!S.future.length) return; S.history.push(snapshot()); restore(S.future.pop()); requestRender(); drawOverlay() }

function stampCircle(px, py, r, value) {
  const c = S.cell, gw = S.gw, gh = S.gh, cells = S.cells
  const sq = S.square
  const cx0 = Math.floor((px - r) / c), cx1 = Math.floor((px + r) / c)
  const cy0 = Math.floor((py - r) / c), cy1 = Math.floor((py + r) / c)
  for (let cy = cy0; cy <= cy1; cy++) {
    if (cy < 0 || cy >= gh) continue
    const row = cy * gw
    for (let cx = cx0; cx <= cx1; cx++) {
      if (cx < 0 || cx >= gw) continue
      const dx = (cx + 0.5) * c - px, dy = (cy + 0.5) * c - py
      if (sq ? (Math.abs(dx) > r || Math.abs(dy) > r) : (dx * dx + dy * dy > r * r)) continue
      paintCell(row + cx, value)
    }
  }
}
/* 油漆桶：从落点出发扩散，把连通区改成 value。
   「同一个区」按目标通道判定：涂普通看 bit0、涂反相看 bit1、橡皮看整个格值。
   注意：涂完的格子仍然属于该通道，所以必须用独立的 seen 位图防重入，
   不能靠「值被改掉」来终止。 */
function bucketFill(p, value) {
  const gw = S.gw, gh = S.gh, cells = S.cells
  const cx = Math.floor(p.x / S.cell), cy = Math.floor(p.y / S.cell)
  if (cx < 0 || cy < 0 || cx >= gw || cy >= gh) return 0
  const key = (v) => value === 0 ? v : (value === 2 ? ((v >> 1) & 1) : (v & 1))
  const k0 = key(cells[cy * gw + cx])
  if (value === 0 ? k0 === 0 : k0 === 1) return 0   /* 落点本来就在目标区里 */
  const seen = new Uint8Array(gw * gh)
  const stack = [cy * gw + cx]
  seen[cy * gw + cx] = 1
  let filled = 0
  while (stack.length) {
    const i = stack.pop()
    paintCell(i, value); filled++
    const x = i % gw, y = (i - x) / gw
    if (x > 0 && !seen[i - 1] && key(cells[i - 1]) === k0) { seen[i - 1] = 1; stack.push(i - 1) }
    if (x < gw - 1 && !seen[i + 1] && key(cells[i + 1]) === k0) { seen[i + 1] = 1; stack.push(i + 1) }
    if (y > 0 && !seen[i - gw] && key(cells[i - gw]) === k0) { seen[i - gw] = 1; stack.push(i - gw) }
    if (y < gh - 1 && !seen[i + gw] && key(cells[i + gw]) === k0) { seen[i + gw] = 1; stack.push(i + gw) }
  }
  return filled
}
function strokeTo(a, b, value) {
  const r = Math.max(S.brush / 2, S.cell * 0.5)
  const dx = b.x - a.x, dy = b.y - a.y
  const dist = Math.hypot(dx, dy)
  const steps = Math.max(1, Math.ceil(dist / Math.max(1, r * 0.5)))
  for (let i = 0; i <= steps; i++) stampCircle(a.x + dx * i / steps, a.y + dy * i / steps, r, value)
}
function eraseRectsAt(p) {
  const n = S.rects.length
  S.rects = S.rects.filter(r => !(p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h))
  return n !== S.rects.length
}
function hitRect(p) {
  for (let i = S.rects.length - 1; i >= 0; i--) {
    const r = S.rects[i]
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return r
  }
  return null
}
function imagePoint(e) {
  const rc = frameEl.getBoundingClientRect()
  return {
    x: clamp((e.clientX - rc.left) / rc.width * S.imgW, 0, S.imgW),
    y: clamp((e.clientY - rc.top) / rc.height * S.imgH, 0, S.imgH)

}
function onDown(e) {
  if (!S.img || e.button !== 0) return
  frameEl.setPointerCapture(e.pointerId)
  const p = imagePoint(e)
  const t = S.tool
  S.hover = markRaw(p)
  if (t === 'move') {
    S.sel = hitRect(p)
    if (S.sel) { pushUndo(); S.drag = markRaw({ type: 'move', rect: S.sel, off: { x: p.x - S.sel.x, y: p.y - S.sel.y } }) }
    drawOverlay(); return
  }
  pushUndo()
  if (t === 'rect') { S.drag = markRaw({ type: 'rect', a: p, b: p, subtract: S.subtract }) }
  else if (t === 'line' || (t === 'brush' && e.shiftKey)) { S.drag = markRaw({ type: 'line', a: p, b: p, value: S.subtract ? 2 : 1 }) }
  else if (t === 'fill') {
    bucketFill(p, S.subtract ? 2 : 1)
    S.rev++; maskKey = ''; requestRender(); drawOverlay(); return
  }
  else {
    const v = t === 'eraser' ? 0 : (S.subtract ? 2 : 1)
    S.drag = markRaw({ type: 'paint', last: p, value: v })
    if (t === 'eraser') eraseRectsAt(p)
    strokeTo(p, p, v)
    maskKey = ''
  }
  S.rev++; requestRender(); drawOverlay()
}
function onMove(e) {
  if (!S.img) return
  const p = imagePoint(e)
  S.hover = markRaw(p)
  const d = S.drag
  if (d) {
    if (d.type === 'rect') { d.b = p }
    else if (d.type === 'line') { d.b = p }
    else if (d.type === 'paint') {
      strokeTo(d.last, p, d.value); d.last = p
      if (d.value === 0) eraseRectsAt(p)
    } else if (d.type === 'move') {
      d.rect.x = clamp(p.x - d.off.x, 0, S.imgW - d.rect.w)
      d.rect.y = clamp(p.y - d.off.y, 0, S.imgH - d.rect.h)

  }

}
function onUp(e) {
  const d = S.drag; S.drag = null
  if (!d) return
  if (d.type === 'rect') {
    const r = normRect(d.a, d.b)
    if (r.w >= 2 && r.h >= 2) S.rects.push(markRaw({ x: r.x, y: r.y, w: r.w, h: r.h, subtract: d.subtract }))
    else S.history.pop()
  } else if (d.type === 'line') {
    if (Math.hypot(d.b.x - d.a.x, d.b.y - d.a.y) >= 1) {
      if (d.value === 0 && S.rects.length) eraseRectsAt(d.a)
      strokeTo(d.a, d.b, d.value)
    } else S.history.pop()
  }
  S.rev++; maskKey = ''; requestRender(); drawOverlay()
}

/* ------------------------------------------------------------------ */
/* 布局                                                                */
/* ------------------------------------------------------------------ */
function layout() {
  if (!S.img || !stageEl || !frameEl) return
  const cs = getComputedStyle(stageEl)
  const padX = parseFloat(cs.paddingLeft) || 0, padY = parseFloat(cs.paddingTop) || 0
  const availW = stageEl.clientWidth - padX * 2, availH = stageEl.clientHeight - padY * 2
  const s = Math.min(availW / S.imgW, availH / S.imgH)
  const w = Math.max(64, Math.floor(S.imgW * s)), h = Math.max(64, Math.floor(S.imgH * s))
  frameEl.style.width = w + 'px'; frameEl.style.height = h + 'px'
  const dpr = Math.min(window.devicePixelRatio || 1, 2)
  const ow = Math.max(1, Math.floor(w * dpr)), oh = Math.max(1, Math.floor(h * dpr))
  if (overlay.width !== ow || overlay.height !== oh) { overlay.width = ow; overlay.height = oh }
  overlay.style.width = w + 'px'; overlay.style.height = h + 'px'
  drawOverlay()
  requestRender()
}

/* ------------------------------------------------------------------ */
/* 图片导入 / 导出                                                      */
/* ------------------------------------------------------------------ */
function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image()
    i.onload = () => res(i)
    i.onerror = () => rej(new Error('图片载入失败'))
    i.src = src
  })
}
function setImage(img, name) {
  S.img = markRaw(img)
  S.imgW = img.naturalWidth; S.imgH = img.naturalHeight; S.name = name || 'image'
  /* 画笔栅格：默认约 480 行，且总格数不超过 ~140 万（保证 1px 方块也有意义，又不至于卡住） */
  let c = Math.max(1, Math.round(Math.min(S.imgW, S.imgH) / 480))
  while (c < 64 && Math.ceil(S.imgW / c) * Math.ceil(S.imgH / c) > 1400000) c++
  S.cell = c
  S.gw = Math.ceil(S.imgW / S.cell)
  S.gh = Math.ceil(S.imgH / S.cell)
  S.cells = markRaw(new Uint8Array(S.gw * S.gh))
  S.rects = []; S.history = []; S.future = []; S.sel = null; S.drag = null; S.hover = null
  S.rev++; maskKey = ''
  if (texImage) gl.deleteTexture(texImage)
  texImage = texFromImage(gl, img, gl.CLAMP_TO_EDGE, gl.LINEAR)
  layout(); drawOverlay(); requestRender()
}
async function importFile(file) {
  if (!file || !/^image\//.test(file.type)) { showErr('请选择图片文件'); return }
  const url = URL.createObjectURL(file)
  try { const img = await loadImg(url); setImage(img, file.name) }
  catch (err) { showErr(String(err.message || err)) }
  finally { setTimeout(() => URL.revokeObjectURL(url), 1000) }
}
function exportPNG() {
  if (!S.img) return
  const maxDim = 4096
  const s = Math.min(1, maxDim / Math.max(S.imgW, S.imgH))
  const ew = Math.max(8, Math.round(S.imgW * s)), eh = Math.max(8, Math.round(S.imgH * s))
  const oldW = glCanvas.width, oldH = glCanvas.height
  glCanvas.width = ew; glCanvas.height = eh; maskKey = ''
  try { renderInto(ew, eh) }
  catch (err) { showErr('渲染失败: ' + err.message); glCanvas.width = oldW; glCanvas.height = oldH; return }
  const restoreCanvas = () => { glCanvas.width = oldW; glCanvas.height = oldH; maskKey = ''; requestRender() }
  if (glCanvas.toBlob) {
    glCanvas.toBlob(blob => {
      restoreCanvas()
      if (!blob) { showErr('导出失败'); return }
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = (S.name.replace(/\.[^.]+$/, '') || 'blockarea') + '-blockarea.png'
      document.body.appendChild(a); a.click(); a.remove()
      setTimeout(() => URL.revokeObjectURL(a.href), 5000)
    }, 'image/png')
  } else {
    restoreCanvas()
    const a = document.createElement('a')
    a.href = glCanvas.toDataURL('image/png')
    a.download = (S.name.replace(/\.[^.]+$/, '') || 'blockarea') + '-blockarea.png'
    a.click()
  }
}

/* ------------------------------------------------------------------ */
/* UI 交互                                                             */
/* ------------------------------------------------------------------ */
function setTool(t) {
  S.tool = t
  drawOverlay()
}
function pickFile() { if (fileRef.value) fileRef.value.click() }
function onFileChange(e) {
  const f = e.target.files && e.target.files[0]
  if (f) importFile(f)
  e.target.value = ''
}
function onDrop(e) {
  dragging.value = false
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]
  if (f) importFile(f)
}
function onBrushInput(e) {
  S.brush = parseInt(e.target.value, 10)
  if (S.tool !== 'brush' && S.tool !== 'eraser') setTool('brush')
  requestRender(); drawOverlay()
}
function setBrushTip(sq) { S.square = sq; drawOverlay() }
function onInvertChange(e) { S.subtract = e.target.checked; drawOverlay() }
function onTimeInput(e) { S.time = parseFloat(e.target.value); maskKey = ''; requestRender() }
function togglePlay() { S.playing = !S.playing }
function onBlockPxInput(e) {
  S.blockPx = parseInt(e.target.value, 10) || 4
  maskKey = ''; requestRender()   /* 环带像素数跟着方块粒度走（读数由 computed 刷新） */
}
function onEdgeInput(e) { S.edgeStrength = parseInt(e.target.value, 10) || 6; maskKey = ''; requestRender() }
function onNoiseInput(e) { S.noiseStrength = parseFloat(e.target.value); maskKey = ''; requestRender() }
function onParamInput(name, e) { S.params[name] = parseFloat(e.target.value); maskKey = ''; requestRender() }
function onUndo() { undo() }
function onRedo() { redo() }
function onClear() {
  if (!S.img) return
  pushUndo()
  S.cells.fill(0); S.rects = []; S.sel = null
  S.rev++; maskKey = ''; requestRender(); drawOverlay()
}

function onKeyDown(e) {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return
  if (!(e.ctrlKey || e.metaKey)) return
  const k = e.key.toLowerCase()
  if (k === 'z') { e.preventDefault(); undo() }
  else if (k === 'y') { e.preventDefault(); redo() }
}
function onResize() { layout() }

/* ------------------------------------------------------------------ */
/* 启动 / 卸载                                                         */
/* ------------------------------------------------------------------ */
function loop(ts) {
  if (disposed) return
  rafId = requestAnimationFrame(loop)
  if (S.playing) {
    S.time = (S.time + (lastT ? (ts - lastT) / 1000 : 0)) % 60
    maskKey = ''; dirty = true
  }
  lastT = ts
  if (dirty && S.img) {
    dirty = false
    _renderT0 = performance.now()
    renderNow()
  }
}

onMounted(async () => {
  stageEl = stageRef.value
  frameEl = frameRef.value
  overlay = overlayRef.value
  glCanvas = viewRef.value
  octx = overlay.getContext('2d')

  frameEl.addEventListener('pointerdown', onDown)
  frameEl.addEventListener('pointermove', onMove)
  frameEl.addEventListener('pointerup', onUp)
  frameEl.addEventListener('pointercancel', onUp)
  frameEl.addEventListener('pointerleave', onPointerLeave)
  window.addEventListener('resize', onResize)
  window.addEventListener('keydown', onKeyDown)

  try {
    const imgs = await Promise.all([loadImg(TEX_DISPLACE_URL), loadImg(TEX_SPARK_URL), loadImg(TEX_NOISE_URL)])
    imgDisplace = imgs[0]; imgSpark = imgs[1]; imgNoise = imgs[2]
    NOISE_W = imgDisplace.naturalWidth; NOISE_H = imgDisplace.naturalHeight
    const c = document.createElement('canvas'); c.width = NOISE_W; c.height = NOISE_H
    const cx = c.getContext('2d', { willReadFrequently: true })
    cx.drawImage(imgDisplace, 0, 0)
    const data = cx.getImageData(0, 0, NOISE_W, NOISE_H).data
    noiseR = new Uint8Array(NOISE_W * NOISE_H)
    for (let i = 0; i < noiseR.length; i++) noiseR[i] = data[i * 4]

    initGL()
    setTool('brush')
    rafId = requestAnimationFrame(loop)
  } catch (err) {
    showErr(String(err && err.stack || err))
  }
})

function onPointerLeave() {
  S.hover = null
  drawOverlay()
}

onBeforeUnmount(() => {
  disposed = true
  cancelAnimationFrame(rafId)
  clearTimeout(errTimer)
  window.removeEventListener('resize', onResize)
  window.removeEventListener('keydown', onKeyDown)
  if (frameEl) {
    frameEl.removeEventListener('pointerdown', onDown)
    frameEl.removeEventListener('pointermove', onMove)
    frameEl.removeEventListener('pointerup', onUp)
    frameEl.removeEventListener('pointercancel', onUp)
    frameEl.removeEventListener('pointerleave', onPointerLeave)
  }
  if (gl) {
    const lose = gl.getExtension('WEBGL_lose_context')
    if (lose) lose.loseContext()
  }
  gl = null
})
return { TEX_DISPLACE_URL, TEX_SPARK_URL, TEX_NOISE_URL, BASE_FLOATS, BASE_COLORS, SPARK_TINT, SLIDERS, OUTER_SLIDERS, INNER_SLIDERS, TOOLS, TOOL_NAMES, BRUSH_TIPS, clamp, _f32, medium, noiseIndex, CENTERED, GLOW_W, S, errMsg, dragging, frameRef, stageRef, viewRef, overlayRef, fileRef, toolName, gl, progBlock, texDisplace, imgDisplace, noiseR, maskKey, dirty, cacheBlock, rafId, showErr, createGL, compile, link, texFromImage, makeSolid, initGL, uB, uBlit, CELL_BIT, cellMatches, paintCell, buildZones, dilate32, computeMasks, uploadMask, previewDims, MASK_MAX, BW_MAX, maskDims, blockDiv, maskGrid, maskBlockPx, edgePassesOf, edgeTexelPx, fmtPx, blockInfo, edgeInfo, blockInfoText, edgeInfoText, bind, renderInto, _renderT0, renderNow, requestRender, normRect, drawOverlay, snapshot, pushUndo, restore, undo, redo, stampCircle, bucketFill, strokeTo, eraseRectsAt, hitRect, imagePoint, onDown, onMove, onUp, layout, loadImg, setImage, importFile, exportPNG, setTool, pickFile, onFileChange, onDrop, onBrushInput, setBrushTip, onInvertChange, onTimeInput, togglePlay, onBlockPxInput, onEdgeInput, onNoiseInput, onParamInput, onUndo, onRedo, onClear, onKeyDown, onResize, loop, onPointerLeave };
}

Vue.createApp({ setup: __npSetup, template: document.getElementById('np-tpl').innerHTML }).mount('#app');
</script>
